services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URI: postgres://brainiac:brainiac@postgres:5432/brainiac?sslmode=disable
      CACHE_IN_MEMORY: "false"
      CACHE_URI: redis://redis:6379/0
      SERVER_ADDR: ":8080"
      STORAGE_ROOT: /data/storage
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-change-me-in-production-at-least-32-chars}
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brainiac
      POSTGRES_PASSWORD: brainiac
      POSTGRES_DB: brainiac
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainiac -d brainiac"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  storage:
